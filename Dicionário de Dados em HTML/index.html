<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dicionário de Dados Conceitual — Sistema de Gestão Xenon Multimarcas.">
    <meta name="theme-color" content="#101827">
    <title>Dicionário de Dados | Xenon Multimarcas</title>

    <style>
        :root {
            color-scheme: light;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f3f6fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --header: #101827;
            --success: #15803d;
            --shadow: 0 8px 30px rgba(15, 23, 42, .06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        button, input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .3);
            outline-offset: 2px;
        }


        .topbar {
            background: var(--header);
            color: white;
            padding: 28px 24px;
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        
        .brand-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary);
            font-size: 21px;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(20px, 3vw, 27px);
            letter-spacing: -.5px;
        }

        .brand p {
            margin: 2px 0 0;
            color: #aebbd0;
            font-size: 13px;
        }

        .hero {
            max-width: 1200px;
            margin: 30px auto 24px;
            padding: 0 24px;
        }

        .hero h2 {
            margin: 0 0 8px;
            font-size: clamp(23px, 4vw, 32px);
            letter-spacing: -.7px;
        }

        .hero p {
            max-width: 720px;
            margin: 0;
            color: var(--muted);
        }

        .main {
            max-width: 1200px;
            margin: auto;
            padding: 0 24px 48px;
        }
